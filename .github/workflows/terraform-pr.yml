name: Terraform PR

on:
  pull_request:
    # Must stay a superset of terraform-apply.yml's own path filter - any PR
    # that would trigger an apply on merge has to trigger a plan here first,
    # or terraform-apply.yml's "reuse the merged PR's plan" path finds no
    # artifact to download and falls back to planning fresh instead.
    paths:
      - "**.tf"
      - "**.tftpl"
      - ".tflint.hcl"
      - ".github/workflows/terraform-pr.yml"
      - ".github/workflows/terraform-apply.yml"

# use_lockfile (S3 native locking, backend.tf) already prevents concurrent
# state corruption, but plans for different services piling up on each
# other's lock is still wasted CI time - keep runs serialized regardless.
concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TF_VERSION: "1.10.5" # >= 1.10 required for the S3 backend's use_lockfile
  TF_IN_AUTOMATION: "true"

jobs:
  lint:
    name: Format, lint, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: tflint init
        run: tflint --init
      - name: tflint
        run: tflint --recursive

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  validate:
    name: Validate (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every standalone Terraform root in the repo: each module (they
        # declare their own required_providers, or lack thereof, in their
        # own versions.tf - modules/omada intentionally has none, see
        # ADR-0008) plus one entry per service root (ADR-0004: one root per
        # service, not one shared environment root). Add a line here for
        # every new module or service.
        root:
          - modules/fcos-quadlet-vm
          - modules/omada
          - modules/porkbun-acme-tls
          - environments/homelab/omada
          - environments/homelab/gha-runner
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init (no backend)
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: ${{ matrix.root }}
        run: terraform validate

  plan:
    name: Plan (${{ matrix.service }})
    needs: [lint, validate]
    strategy:
      fail-fast: false
      matrix:
        # Service roots only - modules/fcos-quadlet-vm has no state of its
        # own to plan. gha-runner is deliberately excluded: it's the
        # self-hosted runner this job itself runs on, so planning it here
        # would be circular (ADR-0005's bootstrap chicken-and-egg note) -
        # it's planned/applied manually per its own README instead. Add a
        # line here for every new service that isn't a bootstrap dependency
        # of this workflow.
        service: [omada]

    runs-on: [self-hosted, homelab]
    # Proxmox connection vars/secrets (PROXMOX_ENDPOINT, PROXMOX_NODE,
    # SSH_PUBLIC_KEY, PROXMOX_API_TOKEN - no TF_ prefix) live in this GitHub
    # Actions environment, not as plain repo variables/secrets - a job only
    # gets access to an environment's vars/secrets context if it declares
    # `environment:`. No protection rules on "homelab", so this doesn't gate
    # PR runs on manual approval.
    environment: homelab
    permissions:
      contents: read
      pull-requests: write
      # Required for aws-actions/configure-aws-credentials' OIDC role
      # assumption below - without it the runner can't request the GitHub
      # Actions ID token the AssumeRoleWithWebIdentity call needs.
      id-token: write
    env:
      TF_VAR_proxmox_endpoint: ${{ vars.PROXMOX_ENDPOINT }}
      TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
      TF_VAR_proxmox_node: ${{ vars.PROXMOX_NODE }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      # No TF_VAR_porkbun_api_key/secret here, deliberately - modules/porkbun-acme-tls
      # takes no credential input at all (ADR-0010). Only acme_email
      # (non-secret) is needed.
      TF_VAR_acme_email: ${{ vars.ACME_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TF_AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init
        working-directory: environments/homelab/${{ matrix.service }}
        run: terraform init

      - name: terraform plan
        id: plan
        working-directory: environments/homelab/${{ matrix.service }}
        timeout-minutes: 5
        run: terraform plan -no-color -input=false -out=tfplan
        continue-on-error: true

      # Saved so a merge of this PR can apply exactly what was reviewed
      # here instead of re-planning after merge, once an apply workflow
      # exists to consume it.
      - name: Upload plan artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ matrix.service }}
          path: environments/homelab/${{ matrix.service }}/tfplan
          retention-days: 5

      - name: Comment plan on PR
        uses: actions/github-script@v9
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          SERVICE: ${{ matrix.service }}
        with:
          script: |
            const service = process.env.SERVICE;
            const marker = `<!-- terraform-plan:${service} -->`;
            const outcome = process.env.PLAN_OUTCOME;
            const output = process.env.PLAN_OUTPUT || "(no output captured)";
            const body = `${marker}\n### Terraform Plan: \`${service}\` (\`${outcome}\`)\n<details><summary>Show plan</summary>\n\n\`\`\`\n${output}\n\`\`\`\n\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
